server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    types {
        model/gltf-binary glb;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|glb)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
