server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html names the hashed asset bundles, so a cached copy pins visitors to
    # an old build. Without an explicit policy browsers cache it heuristically.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|glb)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.glb$ {
        default_type model/gltf-binary;
    }
}
